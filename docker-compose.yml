services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: patchwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patchwork
    ports:
      - "5432:5432"
    volumes:
      - patchwork_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patchwork"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patchwork-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - patchwork_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  patchwork_pgdata:
  patchwork_redisdata:

