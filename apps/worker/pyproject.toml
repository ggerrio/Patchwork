[project]
name = "patchwork-worker"
version = "0.1.0"
description = "Patchwork ARQ Background Worker & LangGraph Autonomous Healing Engine"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-google-genai>=2.0.5",
    "langchain-groq>=0.2.1",
    "tree-sitter>=0.23.2",
    "tree-sitter-python>=0.23.2",
    "docker>=7.1.0",
    "httpx>=0.27.2",
    "PyGithub>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

